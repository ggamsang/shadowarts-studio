<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shadow Art Scene</title>
    <style>
        body { margin: 0; overflow: hidden; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dat.gui/build/dat.gui.min.js"></script>
</head>
<body>
    <script>
        // 🚀 Three.js 기본 설정
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(2, 2, 5);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // 🚀 벽 & 바닥 (세 개의 면 만들기)
        const wallMaterial = new THREE.ShadowMaterial({ opacity: 0.5 });

        const floor = new THREE.Mesh(new THREE.PlaneGeometry(5, 5), wallMaterial);
        floor.rotation.x = -Math.PI / 2;
        floor.position.y = -1;
        floor.receiveShadow = true;
        scene.add(floor);

        const backWall = new THREE.Mesh(new THREE.PlaneGeometry(5, 5), wallMaterial);
        backWall.position.z = -2;
        backWall.receiveShadow = true;
        scene.add(backWall);

        const sideWall = new THREE.Mesh(new THREE.PlaneGeometry(5, 5), wallMaterial);
        sideWall.rotation.y = Math.PI / 2;
        sideWall.position.x = -2;
        sideWall.receiveShadow = true;
        scene.add(sideWall);

        // 🚀 그림자 생성할 3D 객체 (중앙에 배치)
        const objectGeometry = new THREE.TorusKnotGeometry(0.4, 0.1, 100, 16);
        const objectMaterial = new THREE.MeshStandardMaterial({ color: 0x0077ff });
        const object = new THREE.Mesh(objectGeometry, objectMaterial);
        object.position.set(0, 0, 0);
        object.castShadow = true;
        scene.add(object);

        // 🚀 직교하는 광원 추가
        const light1 = new THREE.DirectionalLight(0xffffff, 1);
        light1.position.set(3, 2, 0);
        light1.castShadow = true;
        scene.add(light1);

        const light2 = new THREE.DirectionalLight(0xffffff, 1);
        light2.position.set(0, 2, 3);
        light2.castShadow = true;
        scene.add(light2);

        // 🚀 광원 조절 UI 추가
        const gui = new dat.GUI();
        const lightFolder1 = gui.addFolder("Light 1 Position");
        lightFolder1.add(light1.position, "x", -5, 5);
        lightFolder1.add(light1.position, "y", -5, 5);
        lightFolder1.add(light1.position, "z", -5, 5);
        lightFolder1.open();

        const lightFolder2 = gui.addFolder("Light 2 Position");
        lightFolder2.add(light2.position, "x", -5, 5);
        lightFolder2.add(light2.position, "y", -5, 5);
        lightFolder2.add(light2.position, "z", -5, 5);
        lightFolder2.open();

        // 🚀 애니메이션 루프
        function animate() {
            requestAnimationFrame(animate);
            //object.rotation.y += 0.01; // 물체 회전 효과
            renderer.render(scene, camera);
        }
        animate();

    </script>
</body>
</html>
